# Runs production on the VPS. Build first with the root compose file, then run this one.
# Run both from the repo root:
#   APP_ENV=production docker compose build
#   docker compose --project-directory . -f docker/production/compose.yml up -d
# Only pre-built images run here. No source is mounted, so the image is what runs.
name: poychamp-blog-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  php:
    image: poychamp-blog-php:production
    env_file: .env
    restart: unless-stopped
    logging: *logging
    volumes:
      - uploads:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: poychamp-blog-nginx:production
    restart: unless-stopped
    logging: *logging
    ports:
      - "${APP_HOST_PORT:-80}:8080"
    volumes:
      - uploads:/var/www/html/wp-content/uploads:ro
    depends_on:
      - php

  # No ports published. Only php can reach it, over the compose network.
  db:
    image: mariadb:11.8.9-noble
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

# These two hold the blog's posts and media. Back them up.
volumes:
  db-data:
  uploads:
